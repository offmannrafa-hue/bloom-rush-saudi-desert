  function drawAcacia(c,growth,t,seed){

      for(let i=0;i<7;i++)ellipse(c,-48+i*16,-83+Math.sin(i*2)*9,2.8,2.8,'#ebdda0');

  function drawPlant(p,t){

    if(grown){
      const glow=ctx.createRadialGradient(0,-8,5,0,-8,80);glow.addColorStop(0,'#8ebc6450');glow.addColorStop(1,'#90b96300');ctx.fillStyle=glow;ctx.fillRect(-85,-85,170,160);

      ctx.beginPath();ctx.ellipse(0,0,61,27,0,0,TAU);ctx.strokeStyle=selected?'#f8f4d8':'#ac8b5355';ctx.lineWidth=selected?3:1.5;ctx.setLineDash(selected?[]:[3,6]);ctx.stroke();ctx.setLineDash([]);

    ctx.save();ctx.scale(bounce,bounce);if(!grown&&selected&&game.player.raining)ctx.rotate(Math.sin(t*22)*.018);

  function drawCloud(x,y,scale,t,player=false){
    const p=game.player,m=cloudMotion,moving=player&&!reduced?m.amount:0,stride=Math.sin(m.phase);
    const bob=player&&p.pointerControlled?0:Math.sin(t*3)*3,tilt=player?m.lean+stride*moving*.025:Math.sin(t*.7)*.04;
    ctx.save();ctx.translate(x,y);
    if(player){
      ellipse(ctx,8,7,48+moving*5,16,p.inStorm?'#956b3d3a':'#7e80602b');
      ctx.strokeStyle=p.raining?'#6ac7b2aa':'#fff3d788';ctx.lineWidth=2;ctx.setLineDash([4,6]);ctx.beginPath();ctx.ellipse(0,0,70,31,0,0,TAU);ctx.stroke();ctx.setLineDash([]);

      if(p.charging){for(let i=0;i<5;i++){const a=t*2+i*TAU/5;ellipse(ctx,Math.cos(a)*46,-30-Math.sin(a)*15,3.5,3.5,'#baffda');}}

    // Animate around the cursor anchor; the cloud position never trails the mouse.
    ctx.translate(0,player?-CLOUD_LIFT+bob:0);if(player)drawCloudWake();ctx.rotate(tilt);
    ctx.scale(scale*(1+stride*moving*.045),scale*(1-stride*moving*.045));
    if(moving>.08){
      for(let i=0;i<2;i++){const step=Math.sin(m.phase+i*Math.PI),footY=22+step*6*moving;
        ellipse(ctx,(i?1:-1)*27,footY,12,6,'#e8efda');ctx.strokeStyle='#6e948068';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse((i?1:-1)*27,footY,12,6,0,0,TAU);ctx.stroke();
      }
    }
    ctx.shadowColor='#55745a24';ctx.shadowBlur=13;ctx.shadowOffsetY=8;
    path(ctx,c=>{c.moveTo(-39,20);c.bezierCurveTo(-68,20,-68,-16,-44,-19);c.bezierCurveTo(-43,-47,-10,-55,7,-37);c.bezierCurveTo(26,-50,50,-35,49,-16);c.bezierCurveTo(73,-18,77,18,51,23);c.bezierCurveTo(30,27,-19,25,-39,20);c.closePath();},'#fffbdf',INK,2.5);
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    path(ctx,c=>{c.moveTo(-55,12);c.quadraticCurveTo(-27,27,5,18);c.quadraticCurveTo(34,26,58,12);c.quadraticCurveTo(57,25,36,25);c.lineTo(-35,22);c.quadraticCurveTo(-49,22,-55,12);},'#dce9d9');
    path(ctx,c=>{c.moveTo(-36,-25);c.quadraticCurveTo(-30,-39,-17,-38);},null,'#ffffff',4);
    ctx.save();ctx.translate(4,-37);ctx.rotate(stride*moving*.18);
    line(ctx,0,0,4,-19,INK,2.5);ellipse(ctx,-5,-17,9,4.5,'#81b780',.55);ellipse(ctx,11,-24,10,5,'#aac78b',-.6);line(ctx,4,-19,10,-23,'#477f60',1);ctx.restore();
    const blink=Math.sin(t*.68)>.994,look=player?m.dx*moving*2:0;
    if(blink){line(ctx,-22,0,-14,0,INK,2.5);line(ctx,18,0,26,0,INK,2.5);}else{ellipse(ctx,-18+look,-1,3,4.2,INK);ellipse(ctx,22+look,-1,3,4.2,INK);ellipse(ctx,-17+look,-2,1,1,'white');ellipse(ctx,23+look,-2,1,1,'white');}
    ellipse(ctx,-28,6,7,3.5,'#efb5a0');ellipse(ctx,33,6,7,3.5,'#efb5a0');
    if(player&&p.inStorm)path(ctx,c=>{c.moveTo(-2,12);c.quadraticCurveTo(4,7,10,12);},null,INK,2);
    else path(ctx,c=>{c.moveTo(-2,8);c.quadraticCurveTo(4,16,10,8);},null,INK,2);
    if(player&&p.water<1){ctx.fillStyle='#bd784b';ctx.font='900 9px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText(tr('oasisShort'),2,-76);}
    ctx.restore();
  }

  function drawStorm(s,t){
    ctx.save();ctx.translate(s.x,s.y);const r=s.radius;
    ellipse(ctx,5,8,r*.85,r*.34,'#b3895230');
    const haze=ctx.createRadialGradient(0,-38,4,0,-38,r*1.5);haze.addColorStop(0,'#c3926370');haze.addColorStop(1,'#dcb87900');ctx.fillStyle=haze;ctx.fillRect(-r*1.5,-r*2,r*3,r*3);
    ctx.beginPath();ctx.ellipse(0,0,r+18,(r+18)*.46,0,0,TAU);ctx.setLineDash([4,7]);ctx.strokeStyle='#a16e3b88';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);
    for(let i=0;i<7;i++){const width=12+i*7,y=-8-i*11,x=Math.sin(t*3+i*.9+s.phase)*(3+i*1.8);ctx.beginPath();ctx.ellipse(x,y,width,4+i*.8,Math.sin(t+i)*.06,t*3+i*.7,t*3+i*.7+Math.PI*1.65);ctx.strokeStyle=i%2?'#fff0bdac':'#b58859a0';ctx.lineWidth=5+i*.5;ctx.lineCap='round';ctx.stroke();}
    for(let i=0;i<15;i++){const a=t*2+i*2.4,rad=25+(i%5)*9;ellipse(ctx,Math.cos(a)*rad,-45+Math.sin(a)*33,1.6,1,'#ac7f4ca0');}
    roundRect(ctx,-50,-118,100,20,10,'#b28050');ctx.fillStyle='#fff2ca';ctx.font='900 8px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText(tr('sandstorm'),0,-105);
    ctx.restore();
  }
  function drawAmbient(t,titleMode){
    ctx.save();ctx.globalAlpha=.48;
    for(let i=0;i<7;i++){const x=((i*293+t*(7+i%3))%1850)-100,y=58+(i%3)*56;
      path(ctx,c=>{c.moveTo(x,y);c.bezierCurveTo(x+30,y-10,x+61,y+8,x+105,y-1);},null,'#fff9df',2);}
    ctx.globalAlpha=.2;
    for(let i=0;i<16;i++){const x=(i*137+t*19)%1600,y=320+(i*97)%510+Math.sin(t+i)*12;line(ctx,x,y,x+8,y-1,'#fff8da',1.4);}
    ctx.restore();
    if(titleMode){ctx.save();ctx.translate(1190,135);ctx.rotate(-.2);ctx.strokeStyle='#6b8c7e88';ctx.lineWidth=2;for(let i=0;i<3;i++){let x=i*55,y=Math.sin(i*2+t*.7)*7;path(ctx,c=>{c.moveTo(x,y);c.quadraticCurveTo(x+7,y-5,x+14,y);c.quadraticCurveTo(x+21,y-5,x+28,y);},null,'#66887b88',2);}ctx.restore();}
  }
  function drawTitle(t){
    ctx.drawImage(scenery,-8+Math.sin(t*.2)*3,0,W+16,H);ctx.drawImage(background,0,0);drawAmbient(t,true);
    // A softened left edge gives the display typography room to breathe.
    const wash=ctx.createLinearGradient(0,0,800,0);wash.addColorStop(0,'#f5e3b9e0');wash.addColorStop(.8,'#f3dfb147');wash.addColorStop(1,'#f3dfb100');ctx.fillStyle=wash;ctx.fillRect(0,0,850,H);
    ctx.save();ctx.translate(1235,666);ctx.scale(2.05,2.05);ellipse(ctx,13,4,75,14,'#a78c5233');drawAcacia(ctx,1,t,7);ctx.restore();
    ctx.save();ctx.translate(920,737);ctx.scale(1.8,1.8);ellipse(ctx,8,3,44,12,'#a78c5233');drawArta(ctx,1,t,12);ctx.restore();
    ctx.save();ctx.translate(1410,755);ctx.scale(1.65,1.65);ellipse(ctx,8,3,44,12,'#a78c5233');drawArfaj(ctx,1,t,18);ctx.restore();
    const cloudX=1050+Math.sin(t*.6)*16,cloudY=409+Math.sin(t*1.3)*9;
    for(let i=0;i<14;i++){const x=cloudX+(i%5-2)*26,y=cloudY+58+((t*130+i*29)%150);ctx.globalAlpha=(1-(y-cloudY-58)/155)*.7;line(ctx,x,y,x-4,y+11,'#57aaa4',3);}
    ctx.globalAlpha=1;drawCloud(cloudX,cloudY,2.05,t,false);
    // Hand-drawn motion marks, with no external illustration assets.
    path(ctx,c=>{c.moveTo(842,400);c.quadraticCurveTo(820,434,849,469);c.quadraticCurveTo(861,483,876,475);},null,'#73907a',2);path(ctx,c=>{c.moveTo(865,468);c.lineTo(876,475);c.lineTo(867,484);},null,'#73907a',2);
    ctx.fillStyle='#5a7c68';ctx.font='italic 15px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.save();ctx.translate(848,522);ctx.rotate(-.16);ctx.fillText(tr('thatsYou'),0,0);ctx.restore();
  }
  function drawPickup(item,time){
    ctx.save();ctx.translate(item.x,item.y);const bob=Math.sin(time*3+item.id)*4,colors={seed:'#92ad73',gold:'#d6a546',water:'#59b6ad',boost:'#63a88c'},color=colors[item.kind];
    ellipse(ctx,3,6,22,7,'#8c784726');ctx.translate(0,-19+bob);ctx.globalAlpha=Math.min(1,(item.expires-game.elapsed)/2);
    if(item.kind==='gold'){const glow=ctx.createRadialGradient(0,0,2,0,0,46);glow.addColorStop(0,'#fff0acaa');glow.addColorStop(1,'#fff0ac00');ctx.fillStyle=glow;ctx.fillRect(-46,-46,92,92);}
    ellipse(ctx,0,0,20,20,'#fff4d9');ctx.beginPath();ctx.arc(0,0,20,0,TAU);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
    if(item.kind==='seed'||item.kind==='gold'){ellipse(ctx,0,0,8,13,color,.6);line(ctx,-4,7,4,-7,item.kind==='gold'?'#ffedb0':'#d0e3ac',1.5);if(item.kind==='gold'){ctx.fillStyle='#fff0b8';ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.fillText('✦',22,-17);}}
    if(item.kind==='water'){path(ctx,c=>{c.moveTo(0,-13);c.bezierCurveTo(-20,8,-4,18,6,11);c.bezierCurveTo(17,4,5,-8,0,-13);},color);line(ctx,-3,6,3,6,'#e6ffe8',2);line(ctx,0,3,0,9,'#e6ffe8',2);}
    if(item.kind==='boost'){path(ctx,c=>{c.moveTo(-12,6);c.lineTo(-2,-7);c.lineTo(-2,0);c.lineTo(9,-9);c.lineTo(12,-3);c.lineTo(0,10);c.lineTo(0,3);c.closePath();},color);}
    if(Math.hypot(game.player.x-item.x,game.player.y-item.y)<190){const key={seed:'seedLegend',gold:'goldLegend',water:'waterLegend',boost:'boostLegend'}[item.kind];ctx.fillStyle='#476a52';ctx.font='900 8px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText(tr(key),0,38);}
    ctx.restore();
  }

  function drawWildlife(t){
    // Tiny original silhouettes wander on the far dune, adding life without becoming targets.
    const animals=[
      {type:'gazelle',x:((t*18+150)%1900)-150,y:312,scale:.72,flip:1},
      {type:'gazelle',x:((t*14+820)%1900)-150,y:330,scale:.58,flip:-1},
      {type:'camel',x:((t*8+1220)%2050)-180,y:292,scale:.62,flip:1}
    ];
    for(const a of animals){
      const bob=Math.sin(t*8+a.x*.01)*1.8,step=Math.sin(t*8+a.x*.018)*4;
      ctx.save();ctx.translate(a.x,a.y+bob);ctx.scale(a.flip*a.scale,a.scale);ctx.globalAlpha=.42;
      ctx.fillStyle='#806c52';ctx.strokeStyle='#806c52';ctx.lineCap='round';ctx.lineJoin='round';
      if(a.type==='camel'){
        ctx.beginPath();ctx.ellipse(0,-19,26,10,0,0,TAU);ctx.fill();
        ctx.beginPath();ctx.arc(20,-34,7,0,TAU);ctx.fill();ctx.stroke();
        line(ctx,23,-38,30,-44,'#806c52',2.5);line(ctx,-16,-10,-19,16+step,'#806c52',3);line(ctx,12,-10,15,16-step,'#806c52',3);line(ctx,22,-29,30,-31,'#806c52',2);
      }else{
        ctx.beginPath();ctx.ellipse(0,-15,19,7,0,0,TAU);ctx.fill();
        ctx.beginPath();ctx.arc(17,-25,5,0,TAU);ctx.fill();
        line(ctx,20,-27,28,-31,'#806c52',2);line(ctx,-11,-9,-14,12+step,'#806c52',2.5);line(ctx,8,-9,12,12-step,'#806c52',2.5);line(ctx,-17,-17,-26,-22,'#806c52',2);
      }
      ctx.restore();
    }
  }

  function drawWorld(t){
    const parallax=reduced?0:(800-game.player.x)*.012;
    ctx.drawImage(scenery,-10+parallax,0,W+20,H);ctx.drawImage(background,0,0);drawAmbient(t,false);drawWildlife(t);(state==='tutorial'?[OASES[1]]:OASES).forEach(o=>drawOasis(o,t));
    game.plants.forEach(p=>drawPlant(p,t));game.pickups.forEach(item=>drawPickup(item,t));
    // Rain is drawn behind the cloud, above the field.
    for(const p of particles){if(p.kind==='rain')drawParticle(p);}
    game.storms.forEach(s=>drawStorm(s,t));
    drawCloud(game.player.x,game.player.y,1,t,true);
    if(game.player.charging){ctx.fillStyle='#245c50';ctx.font='900 11px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText(tr('refillingCanvas'),game.player.x,game.player.y-157);}
    else if(game.oasisAt(game.player)&&input.rain){ctx.fillStyle='#245c50';ctx.font='900 10px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText(tr('releaseCanvas'),game.player.x,game.player.y-157);}
    // Warn at the edge before a storm enters the play area.
    for(const s of game.storms){if(s.x>1580||s.x<20){const x=s.x>1580?1564:36;roundRect(ctx,x-18,s.y-30,36,36,10,'#b38050');ctx.fillStyle='#fff1c6';ctx.font='900 24px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText('!',x,s.y-4);}}
    if(state!=='tutorial'&&game.blooms===0&&game.elapsed<8){ctx.fillStyle='#466b55';ctx.font='900 12px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText(tr('smallRain'),800,265);}
  }
  function drawParticle(p){
    ctx.save();ctx.globalAlpha=Math.max(0,1-p.age/p.life);
    if(p.kind==='rain'){line(ctx,p.x,p.y,p.x-2,p.y+9,p.color,p.size);}
    else if(p.kind==='petal'){ctx.translate(p.x,p.y);ctx.rotate(p.age*3+p.x);ellipse(ctx,0,0,p.size,p.size*.45,p.color);}
    else ellipse(ctx,p.x,p.y,p.size,p.size,p.color);
    ctx.restore();
  }
  function effects(dt){
    if(['playing','tutorial'].includes(state)&&game.player.raining){rainCarry+=dt*110;while(rainCarry>=1){rainCarry--;particle(game.player.x+(Math.random()-.5)*98,game.player.y-47,{vx:-12,vy:235+Math.random()*100,life:.2+Math.random()*.05,size:1.3+Math.random(),color:'#60b6b0',kind:'rain'});}}
    if(['playing','tutorial'].includes(state)&&game.target?.progress>0&&game.player.raining&&Math.random()<dt*22){const p=game.target;particle(p.x+(Math.random()-.5)*55,p.y-10,{vx:(Math.random()-.5)*30,vy:-30-Math.random()*50,life:.6,color:SPECIES[p.species].color,size:2.5,kind:'petal'});}
    for(const p of particles){p.age+=dt;p.vy+=p.gravity*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    particles=particles.filter(p=>p.age<p.life);for(const f of floaters){f.age+=dt;f.y-=dt*23;}floaters=floaters.filter(f=>f.age<f.life);
    shake*=Math.exp(-dt*10);
  }
  function render(){
    const dpr=canvas.width/W;ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.save();if(shake>.1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    if(backdrop==='title')drawTitle(visualTime);else drawWorld(visualTime);
    for(const p of particles)if(p.kind!=='rain')drawParticle(p);
    for(const f of floaters){ctx.save();ctx.globalAlpha=Math.min(1,(f.life-f.age)*2);ctx.textAlign='center';ctx.font='900 28px "Trebuchet MS",sans-serif';ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);ctx.font='900 9px "Trebuchet MS",sans-serif';ctx.lineWidth=3;ctx.strokeText(f.sub,f.x,f.y+18);ctx.fillText(f.sub,f.x,f.y+18);ctx.restore();}
    ctx.restore();
  }
  function frame(now){
    const raw=Math.max(0,(now-lastFrame)/1000),dt=Math.min(raw,.05);lastFrame=now;visualTime+=dt;input=getInput();
    if(state==='tutorial'){
      game.elapsed=0;game.remaining=DURATION;game.update(dt,input);events();
      if(tutorialStep==='refill'&&game.oasisAt(game.player)&&!input.rain&&game.player.water>=99.99){tutorialStep='done';tutorialDoneAt=visualTime;updateTutorial();$('liveStatus').textContent=t('tutorialReady');}
      if(tutorialDoneAt&&visualTime-tutorialDoneAt>.95)startRound();
    }else if(state==='countdown'){
      countTime+=raw;const n=3-Math.floor(countTime);if(n!==countShown&&n>=0){countShown=n;setCount(n);}
      if(countTime>=3){game.begin();state='playing';screen();audio.play('go');}
    }else if(state==='playing'){
      game.update(raw,input);events();const second=Math.ceil(game.remaining);if(second!==lastSecond){lastSecond=second;if(second<=10&&second>0)audio.play('tick');}
    }
    animateCloud(dt);hudElapsed+=dt;if(hudElapsed>=.04){updateHUD();hudElapsed=0;}
    audio.rain(['playing','tutorial'].includes(state)&&game.player.raining);
    if(!['paused','settings','reset'].includes(state))effects(dt);
    if(toastUntil&&visualTime>toastUntil){visible('phaseToast',false);toastUntil=0;}
    if(burstUntil&&visualTime>burstUntil){visible('comboBurst',false);burstUntil=0;}
    if(state==='results'){const f=Math.min(1,(visualTime-resultTime)/1.1),value=Math.round(game.score*(1-(1-f)**3));if(value!==resultFrom){$('finalScore').textContent=num(value);resultFrom=value;}}
    render();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.BloomRush=Object.freeze({version:'2.0.0',snapshot:()=>({state,elapsed:game.elapsed,score:game.score,blooms:game.blooms,seeds:game.seedCount,language,records:repo.records.length,audio:audio.context?.state||'locked',round})});
})();

</script>
</body>
